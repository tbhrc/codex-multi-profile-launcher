project_id = "CODEX-MULTI-PROFILE-LAUNCHER"
project_name = "Codex Multi-Profile Launcher"
project_root = "."
control_plane = "GitHub"
organisation_master = "tbhrc/workspace/AGENTS.md"
canonical_skills_repo = "tbhrc/workspace"
canonical_skills_root = ".folderdesk/skills"
privileged_runtime_repo = "tbhrc/ai-engine"
default_manager = "github-controller"
default_production_worker = ""
default_review_worker = ""

[workers]
C1 = "~/.codex-business"
C2 = "~/.codex"

[execution]
max_active_tasks_per_worker = 1
require_output_contract = true
require_explicit_worker = true
allow_automatic_account_rotation = false
allow_automatic_profile_fallback = false

[approval]
external_writes = "owning-workflow"
deployments = "owning-workflow"
destructive_actions = "owning-workflow"
credential_changes = "owning-workflow"
